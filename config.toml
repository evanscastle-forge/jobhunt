# --- federal postings. Needs a free API key:
#     https://developer.usajobs.gov/apirequest/  -> put USAJOBS_API_KEY=... and USAJOBS_EMAIL=... in .env
# Anchored on a place, so it ships disabled: copy it into your profile's search.toml with your own
# `locations` and enabled = true. USAJOBS applies the radius server-side, one sweep per anchor.
[[companies]]
