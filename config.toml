# Known to hire heavily in the corridor but NOT reachable yet: Peraton and Noblis (iCIMS),
# ManTech (Avature), MITRE (Phenom), Dominion Energy (SuccessFactors), GA-CCRi (General Atomics'
# BrassRing), Lockheed, RTX, SAIC, L3Harris and Amentum (no public feed found). None of these ATSes serve JSON; adding them means
# writing a scraper per vendor. Listed here so the gap is visible rather than silent.

# --- public job boards (no key). Everyone: the title gate per profile keeps what fits.
[[companies]]
name = "Remotive"
ats = "remotive"
categories = ["software-dev", "data", "product"]

[[companies]]
name = "RemoteOK"
ats = "remoteok"

[[companies]]
name = "Arbeitnow"              # almost entirely European postings; enable if that ever changes
ats = "arbeitnow"
max_pages = 8
enabled = false

[[companies]]
name = "Himalayas"
ats = "himalayas"
max_pages = 30

[[companies]]
name = "The Muse"
ats = "themuse"
categories = ["Data and Analytics", "Software Engineering", "Data Science"]
# Asked of the API one at a time. Remote only here; a profile that wants local offices adds its own
# Muse entry with its cities in search.toml.
locations = ["Flexible / Remote"]
max_pages = 25

# --- aggregators with free API keys (skipped with one log line until the keys are in .env)
#     Adzuna: https://developer.adzuna.com  -> ADZUNA_APP_ID, ADZUNA_APP_KEY
#     Jooble: https://jooble.org/api/about   -> JOOBLE_KEY
# The best free source of SMALL local employers: a keyword search by place returns companies no
# board list knows, and `discover` then finds their boards. 7 queries x 3 anchors x 2 pages = 42 a
# night, plus 9 for the remote entry below: ~357 a week against 1,000. Widen only if the quota is.
[[companies]]
name = "Adzuna"
ats = "adzuna"
queries = ["robotics engineer", "autonomy engineer", "perception engineer", "computer vision engineer",
           "machine learning engineer", "forward deployed engineer", "applied ai engineer"]
# `where` + `distance` are Adzuna's own parameters: one radius sweep per anchor, which is how a
# keyword search gets pinned to the region instead of returning a national sample. Anchored on a
# place, so it ships disabled: copy it into search.toml with your own `locations`.
locations = ["Columbus, OH"]
distance_miles = 75
max_pages = 2
enabled = false

# The entry above is pinned to anchors with a radius, which is how a keyword search finds jobs
# you could actually reach. Discovery wants the opposite: a remote role at a San Francisco company is
# invisible to a "within 100 miles of home" sweep, and that company is exactly the one worth
# finding a board for. So this entry sweeps nationally for remote work, and `jobhunt.py discover`
# harvests the employer names out of whatever it returns.
[[companies]]
name = "Adzuna US remote (discovery)"
ats = "adzuna"
queries = ["remote machine learning engineer", "remote forward deployed engineer", "remote agentic ai"]
max_pages = 3
profiles = ["engineer"]

# Companies that publish no job feed: the careers page itself is read once per scan and its job-title
# links become postings (sources.fetch_page). Use only when `discover` finds no board for the company.
[[companies]]
name = "Perrone Robotics"
ats = "page"
url = "https://www.perronerobotics.com/careers/"
location = "Charlottesville, VA"
profiles = ["engineer"]

[[companies]]
name = "Looq AI"            # utility 3D vision
ats = "page"
url = "https://looq.ai/careers/"
location = "San Diego, CA"
profiles = ["engineer"]

# Google Jobs, via SerpApi. The only legitimate route to LinkedIn, Indeed, ZipRecruiter and
# Glassdoor: all four close their APIs to the public, and Google indexes all four. Each posting says
# which board it came from, and the apply link usually points at the employer's own posting.
# Free tier is 250 searches a MONTH, so this is deliberately tiny -- 3 queries x 2 anchors x 1 page
# is 6 a run, and [quota] serpapi.per_day holds it to 8. Dark until SERPAPI_KEY is in .env.
[[companies]]
name = "Google Jobs (SerpApi)"
ats = "serpapi"
queries = ["forward deployed engineer", "applied ai engineer", "machine learning engineer remote"]
locations = ["Columbus, Ohio", "United States"]
max_pages = 1
enabled = false             # anchored on a place: copy into search.toml with your own locations
profiles = ["engineer"]

# Jooble's free key is 500 requests for its entire life, not per month. At 90 a scan it would be
# permanently spent inside a week, so it is not a scan source: enable it once, run `discover` to
# harvest employer names from what it returns, and park it again.
[[companies]]
name = "Jooble"
enabled = false
ats = "jooble"
queries = ["forward deployed engineer", "applied ai engineer", "machine learning engineer", "data scientist",
           "statistician remote"]
locations = ["United States"]
max_pages = 3

