# jobhunt shared configuration. Every scan re-reads this file.
#
# What lives here is the same for every profile: location vocabularies, the list of company boards
# to fetch, source toggles, LLM settings. What each person is looking for lives in
# profiles/<name>/search.toml, which overrides any table below key-by-key and may add [[companies]].
#
# A [[companies]] entry with `profiles = ["engineer"]` is only scored for a profile whose folder is
# named "engineer" or whose search.toml lists it in `board_tags` (it is still fetched once). Without
# `profiles`, every profile sees it. Tags name a kind of search, never a person.

[location]
# How far away a posting is, measured for real: the location string is resolved against the US Census
# place gazetteer bundled at jobhunt/data/us_places.csv and compared with `origin`. A band says how
# OFTEN you could show up, which is the only question that matters about a distance:
#   remote       no office to reach
#   daily        <= daily_miles      a drive you would make every working day
#   monthly      <= monthly_miles    a drive you would make for a day on site, once or twice a month
#   quarterly    <= radius_miles     a trip you would take a few times a year
#   relocate     > radius_miles      (dropped when keep_us_onsite = false)
# Whether you could turn up as often as a job REQUIRES is a gate, not a score: see [travel] below
# and gates.reach_gate. A posting that states a cadence you could not meet is retired, not demoted.
# Set `origin` to your own city in your profile's search.toml; the value here is the example profiles'.
# 120 miles is about two hours on the interstate.
origin = "Columbus, Ohio"
daily_miles = 0        # 0 turns the distinction off: everything inside monthly_miles is "monthly"
monthly_miles = 120
radius_miles = 500
# The location SCORE (not the gates above): office days a week x commute time. Minutes come from the
# distance at commute_mph door to door; days from the posting when it says, else assumed_office_days.
commute_mph = 45
assumed_office_days = 3
# remote_or_commutable: keep remote-US and in-radius postings, drop non-US.
# remote_or_daily: keep remote-US and offices inside daily_miles; any office further away goes
#   remote_only: drops onsite too. any: keep everything, incl. non-US.
mode = "remote_or_commutable"
keep_us_onsite = true   # false: drop onsite postings BEYOND radius_miles (inside it they are kept)
# Fallback vocabulary only, for strings the gazetteer cannot place (regional nicknames, small
# census-designated places with no population of their own). List your own in search.toml.
# Real distance does the work; anything listed here is treated as monthly_miles away, never as
# home -- returning 0 once put real offices an hour away in the nearest band, above a placed one.
# Bare state names ("virginia", "washington", "maryland") never belong here: as substrings they
# matched West Virginia and Seattle.
commutable = []
us_markers = [
  "united states", "usa", "u.s.", " us", "(us)", "us-", "us -", "- us", "north america", "americas", "anywhere",
]
non_us = [
  "london", "united kingdom", "uk", "england", "ireland", "dublin", "india", "bangalore", "bengaluru", "hyderabad",
  "mumbai", "pune", "gurgaon", "germany", "munich", "berlin", "france", "paris", "netherlands", "amsterdam",
  "spain", "madrid", "barcelona", "italy", "milan", "portugal", "lisbon", "poland", "warsaw", "sweden", "stockholm",
  "switzerland", "zurich", "austria", "japan", "tokyo", "korea", "seoul", "singapore", "australia", "sydney",
  "melbourne", "new zealand", "canada", "toronto", "vancouver", "montreal", "ottawa", "israel", "tel aviv",
  "brazil", "sao paulo", "são paulo", "mexico", "argentina", "colombia", "chile", "dubai", "uae", "qatar", "doha",
  "middle east", "emea", "apac", "latam", "europe", "international", "philippines", "vietnam", "indonesia",
  "malaysia", "thailand", "taiwan", "china", "hong kong", "nigeria", "south africa", "kenya", "egypt", "turkey",
  "remote - india", "remote india", "remote - europe", "bogota", "bogotá", "slovakia", "bratislava", "czech", "prague",
  "hungary", "budapest", "romania", "bucharest", "bulgaria", "sofia", "greece", "athens", "denmark", "copenhagen",
  "norway", "oslo", "finland", "helsinki", "belgium", "brussels", "latin america", "south america", "central europe",
  "eastern europe", "pakistan", "sri lanka", "peru", "lima", "costa rica", "uruguay", "ecuador", "guatemala",
  "serbia", "croatia", "ukraine", "kyiv", "estonia", "tallinn", "lithuania", "vilnius", "latvia", "riga",
  "new delhi", "chennai", "kolkata", "noida", "ahmedabad", "jakarta", "manila", "bangkok", "kuala lumpur",
  "ho chi minh", "hanoi", "taipei", "shanghai", "beijing", "shenzhen", "osaka", "auckland", "brisbane", "perth",
  "cape town", "johannesburg", "lagos", "nairobi", "cairo", "istanbul", "riyadh", "abu dhabi", "amman",
  # Countries as their own residents spell them. A board that lists "Minas Gerais, Brasil" was reading
  # as an unknown location and sailing through the gate, because only "brazil" was here -- and its
  # Portuguese job titles matched an English keyword by prefix ("agente" for "agent"). The location
  # is the load-bearing check: get the country right and the title never gets a chance to be wrong.
  # The rest of the world, pruned of every name an American town also carries. A US state code
  # cannot be used to rescue those towns: "Munich, DE" and "Toronto, CA" look exactly like a US
  # state too, and letting a code override a country name is how Seattle once counted as
  # commutable from Virginia. So the list simply leaves the collisions out.
  #
  # DELIBERATELY ABSENT, because a US town shares the name: georgia (the state), lebanon (NH),
  # jordan (MN), panama (City, FL), cuba (MO), malta (NY), trinidad (CO), monaco (PA), angola (IN),
  # bolivia (NC), liberia, chad, niger. Their capitals are listed instead where it matters --
  # beirut, amman, podgorica -- which is unambiguous and costs nothing.
  "afghanistan", "albania", "algeria", "andorra", "armenia", "azerbaijan", "bahrain",
  "bangladesh", "belarus", "benin", "bhutan", "bosnia", "botswana", "brunei",
  "burkina faso", "burundi", "cambodia", "cameroon", "congo", "cyprus", "dominican republic",
  "el salvador", "eritrea", "eswatini", "ethiopia", "fiji", "gabon", "gambia", "ghana", "guinea",
  "guyana", "haiti", "honduras", "iceland", "iran", "iraq", "jamaica", "kazakhstan",
  "kosovo", "kuwait", "kyrgyzstan", "laos", "lesotho", "libya",
  "liechtenstein", "luxembourg", "macedonia", "madagascar", "malawi", "maldives", "mauritania", "mauritius", "moldova", "mongolia", "montenegro", "morocco", "mozambique",
  "myanmar", "namibia", "nepal", "nicaragua", "north macedonia", "oman", "papua new guinea", "paraguay", "rwanda", "san marino", "saudi arabia", "senegal", "sierra leone",
  "slovenia", "somalia", "sudan", "suriname", "syria", "tajikistan", "tanzania", "togo", "tunisia", "turkmenistan", "uganda", "uzbekistan", "venezuela", "yemen", "zambia", "zimbabwe",
  "yerevan", "tbilisi", "baku", "almaty", "tashkent", "chisinau", "sarajevo", "skopje", "podgorica",
  "ljubljana", "minsk", "tirana", "valletta", "reykjavik", "beirut", "amman", "muscat", "doha",
  "brasil", "méxico", "mexico city", "españa", "espana", "deutschland", "österreich", "osterreich",
  "schweiz", "suisse", "italia", "polska", "sverige", "norge", "danmark", "suomi", "nederland",
  "belgië", "belgique", "türkiye", "turkiye", "cesko", "magyarország", "românia", "romania",
  "minas gerais", "sao paulo, brasil", "são paulo, brasil", "bogotá, colombia", "lima, peru",
]

[travel]
max_pct_ok = 10    # travel up to this percentage is classified "light" and measures -4; the measure falls to -10
                   # at 2.5x this. Any travel is a negative; a stated 0% and silence are 0.

[recency]
# Posting age (from the board's posted date, or from when we first saw an undated posting). The
# `freshness` measure runs +10 under peak_days, 0 at fresh_days, -10 at stale_days and beyond; the
# same keys name the bands the dashboard shows (fresh under fresh_days, mid under stale_days, stale).
peak_days = 7          # younger than this: +10
fresh_days = 14        # here the measure crosses 0
stale_days = 30        # -10 from here on: a month-old posting is probably filled

[enterprise]
# The one gate that fires on a model reading. A posting the model rates
# `enterprise_software` at `rating` or above is retired unless it states a base above `pay_floor`.
# Unstated pay is not above the floor. 0 on either turns the gate off. See AGENTS.md.
rating = 7
pay_floor = 0          # set yours in search.toml; 0 leaves the gate off until a profile turns it on

[scoring]
# Every attribute is measured from -10 to +10. The SIGN says whether it helps or hurts, and ZERO
# means the attribute is simply absent, so a posting is never punished for staying silent. Every
# weight below is 0..10 and says only how much you care; 0 turns an attribute off.
#
# The total has no units, so it is never shown as a number you are meant to interpret. Grades are
# cutoffs at fixed distances from the mean of what was actually scored (A+ is two standard
# deviations up), which means a weak week honestly produces no A grades instead of promoting the
# least bad posting. Run `jobhunt.py retune` after changing anything here.
# The New tab shows this grade and better; the rest sit behind the "hidden" link. B+ is roughly the
# top quarter, which is a list you can actually work through: 500 postings you skim is worse than
# 240 you read.
min_grade = "B+"
clearance_active = false  # true if you hold an active clearance today: postings that require one
                          # then measure +8 instead of -10. Lapsed or never held: leave it false.

# Every attribute contributes weight x measure (a role attribute also times role_weight / 10), and
# the dashboard shows exactly that multiplier. The shipped order: overall fit, location, pay, travel
# and product ownership first; freshness next; domain, feedback loop and seniority after; everything
# else lower. Override any of it in search.toml.
role_weight = 10          # multiplier on the whole role family: 10 = as weighted below
overall_fit = 10          # the model's single read of the whole role

[scoring.pay]
target = 150000           # a posting topping out here measures +10. Set yours in search.toml.
floor = 120000            # and -10 here; unstated pay measures 0 and costs nothing
                          # postings state base, so these are base

[scoring.role]            # the model reads each posting and rates these
product_ownership   = 10  # +10 owns what users touch; -10 plumbing nobody sees
domain              = 6   # +10 agentic AI, autonomy, robotics, simulation, CV, defense, gov, space, manufacturing,
                          #     health, financial infra, audio, materials; 0 none; -10 consumer apps or consumer lending
feedback_loop       = 6   # +10 see the result of a change in hours or days; -10 weeks or quarters away
seniority_fit       = 6   # +10 staff/lead/principal IC; +5 senior IC; 0 not stated; -10 junior, mid or management
work_shape          = 2   # +10 broad, changing, greenfield, own approach; -10 one narrow lane of chores on someone's plan
pace                = 2   # +10 steady, sustainable; -10 hair-on-fire, 60-hour weeks; 0 nothing said
equity_stage        = 2   # +10 Series A-C with real equity; -10 public, PE-owned, bootstrapped services, contract
enterprise_software = 0   # read by the [enterprise] gate, never by the score: 0 so it cannot also demote

[scoring.practical]       # measured from the posting, never guessed
pay               = 10    # -10 at the floor, +10 at the target; unstated pay measures 0 and costs nothing
location          = 10    # +10 remote, +9 no commute, +4 for 30 min daily, <= -8 past an hour more than weekly
travel            = 10    # never positive: -4 up to [travel] max_pct_ok, falling to -10 at 2.5x that; silence 0
freshness         = 8     # +10 under [recency] peak_days, 0 at fresh_days, -10 at stale_days; undated-forever 0
clearance         = 3     # -10 needs a clearance already active; +3 eligibility only

# Ceilings on the sources that charge. A quota is not a rate limit: the per-host throttle paces
# requests so a server is never hit too fast, while this is a budget that does not refill. Measured
# against the entries below as they were first written, a nightly scan would have exhausted Adzuna's
# week in five days and Jooble permanently in under a week.
#
# A source whose allowance does not refill can never be a per-scan source, however useful it is.
# Counters live in data/quota.json and are spent BEFORE the request, so a crash costs the budget
# rather than silently overspending it. 0 means no ceiling.
[quota]
adzuna.per_day = 200        # free tier: 250/day, 1000/week, 2500/month. Leave headroom for discover.
serpapi.per_day = 8         # free tier: 250 searches a MONTH, so about eight a day
jooble.lifetime = 500       # the whole allowance this key will ever have
usajobs.per_day = 0         # unlimited, and free

[discovery]
# `jobhunt.py discover` finds companies rather than fetching ones you already named: it harvests
# employer names from every source that reports one, guesses their Greenhouse/Lever/Ashby board
# token, probes it, and keeps the board only if it carries work you want and could reach.
#
# A board that answers but has nothing relevant is PARKED, not discarded -- its token is known, and
# rechecking costs one request, which catches the day it posts the role you were waiting for.
max_daily_boards = 600    # the daily scan's ceiling. 160 boards is a 155MB cache and 7 minutes;
                          # promotions past this are parked, least promising first, and reported.
recheck_days = 90         # how long a parked board waits before it is looked at again
requests_per_second = 4   # per hostname, across every source. Politeness, and not getting blocked.

[apply]
# How many apply windows may wait for your review at once; the rest stay queued.
max_open_windows = 6
# The browser apply windows use. "chrome" is your installed Google Chrome ("" = Playwright's bundled
# Chromium). With persistent_profile, each window reuses a profile under profiles/<name>/data/browser/,
# so cookies and portal logins survive between runs, as a person's browser would.
browser = "chrome"
persistent_profile = true
# On Apply, build a resume variant keyed to the posting's vocabulary from profiles/<name>/resume/master.html
# and upload it instead of documents.resume (docs/apply-design.md, "The resume: one variant per posting").
# Only approved entries in resume/terms.md are applied. No master: the base resume is uploaded.
tailor_resume = true

[sources]
hn_who_is_hiring = true   # Hacker News monthly thread (noisier, but startups you'd never find otherwise)
hn_max_comments = 3000

[llm]
backend = "claude-cli"    # none | claude-cli | anthropic   (see README; drafts are always flagged for review)
model = "claude-sonnet-5"   # passed to every call (scoring, the applicant agent, self-healing)
effort = "medium"           # claude-cli only: low | medium | high | xhigh | max

[llm.resume]                # the one call that reads a posting for the resume variant (apply, resume variant/propose):
model = "claude-fable-5-1"  # extraction, not judgement, so Fable at low effort; everything else keeps [llm]
effort = "low"

