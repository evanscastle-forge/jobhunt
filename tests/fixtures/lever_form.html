<!doctype html>
<html><head><title>Forward Deployed Engineer - Example Defense</title></head>
<body>
<h2>Submit your application</h2>
<form id="application-form">
  <div class="application-question"><div class="application-label">Resume/CV ✱</div><div class="application-field"><input type="file" name="resume" style="opacity:0"></div></div>
  <div class="application-question"><div class="application-label">Full name ✱</div><div class="application-field"><input type="text" name="name" placeholder="Full name" required></div></div>
  <div class="application-question"><div class="application-label">Email ✱</div><div class="application-field"><input type="email" name="email" placeholder="Email" required></div></div>
  <div class="application-question"><div class="application-label">Phone</div><div class="application-field"><input type="text" name="phone" placeholder="Phone"></div></div>
  <div class="application-question"><div class="application-label">Current company</div><div class="application-field"><input type="text" name="org" placeholder="Current company"></div></div>
  <div class="application-question"><div class="application-label">LinkedIn URL</div><div class="application-field"><input type="text" name="urls[LinkedIn]" placeholder="LinkedIn URL"></div></div>
  <div class="application-question">
    <div class="application-label">Are you legally authorized to work in the United States? ✱</div>
    <div class="application-field">
      <label><input type="radio" name="cards[abc][field0]" value="Yes" required> Yes</label>
      <label><input type="radio" name="cards[abc][field0]" value="No"> No</label>
    </div>
  </div>
  <div class="application-question">
    <div class="application-label">Do you currently hold an active security clearance?</div>
    <div class="application-field">
      <label><input type="radio" name="cards[abc][field1]" value="Yes"> Yes</label>
      <label><input type="radio" name="cards[abc][field1]" value="No"> No</label>
    </div>
  </div>
  <div class="application-question custom-question">
    <div class="application-label"><div class="text">Are you willing to work in a SCIF?<span class="required">✱</span></div></div>
    <div class="application-field">
      <label><input type="radio" name="cards[def][field0]" value="Yes"> Yes</label>
      <label><input type="radio" name="cards[def][field0]" value="No"> No</label>
    </div>
  </div>
  <div class="application-question"><div class="application-label">Additional information</div><div class="application-field"><textarea name="comments" placeholder="Add a cover letter or anything else you want to share."></textarea></div></div>
  <button type="button" id="btn-submit" onclick="document.body.insertAdjacentHTML('beforeend','<p>Application submitted. Thanks!</p>')">Submit application</button>
</form>
</body></html>
