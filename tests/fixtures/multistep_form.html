<!doctype html>
<html><head><title>Engineer - Example (3-step form)</title><style>.s{display:none}.on{display:block}</style></head><body>
<h1>Apply</h1>
<form id="app">
  <div class="s on" id="s1"><h3>Step 1 / 3</h3>
    <input id="a" placeholder="Full name" required><input id="b" placeholder="Email" type="email" required><input id="c" placeholder="Phone">
    <button type="button" onclick="go(2)">Continue</button></div>
  <div class="s" id="s2"><h3>Step 2 / 3</h3>
    <label for="cv">Resume *</label><input id="cv" type="file" required>
    <label for="loc">Current location</label><input id="loc">
    <button type="button" onclick="go(3)">Continue</button></div>
  <div class="s" id="s3"><h3>Step 3 / 3</h3>
    <label for="auth">Are you legally authorized to work in the United States? *</label>
    <select id="auth" required><option value="">Select</option><option>Yes</option><option>No</option></select>
    <button type="button" onclick="document.body.dataset.submitted='1'">Submit application</button></div>
</form>
<script>function go(n){ if (n===2 && !document.getElementById('a').value) return; document.querySelectorAll('.s').forEach(s=>s.classList.remove('on')); document.getElementById('s'+n).classList.add('on'); }</script>
</body></html>
